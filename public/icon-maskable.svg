<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradMask" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="60%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>
    <linearGradient id="emeraldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roseGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="lineGradMask" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background for Android maskable shape clipping -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Scaled into the 80% safe zone (center 256, 256) -->
  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)">
    <!-- Circuit gridlines -->
    <g stroke="#ffffff" stroke-width="2" stroke-opacity="0.08">
      <line x1="120" y1="80" x2="120" y2="432"/>
      <line x1="256" y1="80" x2="256" y2="432"/>
      <line x1="392" y1="80" x2="392" y2="432"/>
      <line x1="80" y1="120" x2="432" y2="120"/>
      <line x1="80" y1="256" x2="432" y2="256"/>
      <line x1="80" y1="392" x2="432" y2="392"/>
    </g>

    <!-- Interconnecting Sequence Path -->
    <path d="M 140 372 L 256 372 L 256 256 L 372 256 L 372 140" fill="none" stroke="url(#lineGradMask)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Row 3 (Bottom) -->
    <g transform="translate(140, 372)">
      <circle r="36" fill="#042f2e" stroke="#10b981" stroke-width="3"/>
      <circle r="22" fill="url(#emeraldGradMask)"/>
      <path d="M -8 1 L -2 7 L 8 -5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(256, 372)">
      <circle r="36" fill="#042f2e" stroke="#10b981" stroke-width="3"/>
      <circle r="22" fill="url(#emeraldGradMask)"/>
      <path d="M -8 1 L -2 7 L 8 -5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(372, 372)">
      <circle r="28" fill="#181d2a" stroke="#334155" stroke-width="2"/>
      <circle r="10" fill="#475569"/>
    </g>

    <!-- Row 2 (Middle) -->
    <g transform="translate(140, 256)">
      <circle r="36" fill="#042f2e" stroke="#10b981" stroke-width="3"/>
      <circle r="22" fill="url(#emeraldGradMask)"/>
      <path d="M -8 1 L -2 7 L 8 -5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(256, 256)">
      <circle r="44" fill="#064e3b" stroke="#34d399" stroke-width="4"/>
      <circle r="28" fill="url(#emeraldGradMask)"/>
      <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">100</text>
    </g>
    <g transform="translate(372, 256)">
      <circle r="40" fill="#4c0519" stroke="#fb7185" stroke-width="3"/>
      <circle r="24" fill="url(#roseGradMask)"/>
      <circle r="8" fill="#ffffff"/>
    </g>

    <!-- Row 1 (Top) -->
    <g transform="translate(140, 140)">
      <circle r="28" fill="#181d2a" stroke="#334155" stroke-width="2"/>
      <circle r="10" fill="#475569"/>
    </g>
    <g transform="translate(256, 140)">
      <circle r="28" fill="#181d2a" stroke="#334155" stroke-width="2"/>
      <circle r="10" fill="#475569"/>
    </g>
    <g transform="translate(372, 140)">
      <circle r="36" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/>
      <circle r="20" fill="#6366f1"/>
      <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" fill="#ffffff"/>
    </g>
  </g>
</svg>
